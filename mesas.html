<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f5f0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Mesas — Boda Starlin &amp; Reneisy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--ivory:#f8f5f0;--white:#fff;--ink:#261a14;--soft:#65584e;--green:#527653;--green-dark:#315a35;--green-light:#e8f0e7;--gold:#ad8b36;--gold-light:#f6efdc;--red:#b94f49;--red-light:#fbeceb;--line:#e6e0d6;--shadow:0 8px 26px #261a1412}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:Poppins,system-ui,sans-serif}
button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:.9rem max(1rem,calc((100vw - 1320px)/2));box-shadow:0 2px 12px #261a140a}
.brand h1{font:600 1.4rem 'Poppins',system-ui,sans-serif;margin:0}.brand small{color:var(--soft);font-size:.75rem}
.nav{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid #52765340;border-radius:999px;background:#fff;color:var(--ink);padding:.55rem .9rem;text-decoration:none;cursor:pointer;font-size:.75rem;font-weight:500;min-height:38px}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{color:var(--red);border-color:#b94f4935}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.guest:focus-visible,.table-card:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:1.5rem 1rem 7rem}
.intro{max-width:860px;margin:0 0 1.1rem}.intro h2{font:600 clamp(1.8rem,4vw,2.5rem) 'Poppins',system-ui,sans-serif;margin:.25rem 0}.intro p{color:var(--soft);font-size:.83rem;line-height:1.7;margin:.4rem 0}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin:0 0 1rem}
.summary-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:.7rem .8rem}.summary-card strong{display:block;font:600 1.5rem 'Poppins',system-ui,sans-serif;color:var(--green-dark)}.summary-card span{font-size:.75rem;color:var(--soft)}
.options{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;align-items:center;margin:0 0 .9rem;padding:.7rem .9rem;background:#fff;border:1px solid var(--line);border-radius:13px}
.options label{display:flex;align-items:center;gap:.5rem;font-size:.76rem;cursor:pointer}.options input{accent-color:var(--green);width:18px;height:18px}
.options .grow{flex:1;min-width:220px}.options input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;font-size:.76rem}
.notice{margin:0 0 .9rem;display:grid;gap:.4rem}.notice p{margin:0;padding:.6rem .85rem;border-radius:11px;font-size:.75rem;line-height:1.5;background:var(--gold-light);color:#6b5413}.notice p.bad{background:var(--red-light);color:var(--red)}
.error{display:none;margin:0 0 .9rem;padding:.7rem .9rem;border-radius:11px;background:var(--red-light);color:var(--red);font-size:.76rem}.error.show{display:block}
.board{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:1rem;align-items:start}
.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:1rem}
.pool{position:sticky;top:88px;max-height:calc(100dvh - 108px);display:flex;flex-direction:column}
.pool h3{font:600 1.4rem 'Poppins',system-ui,sans-serif;margin:0 0 .2rem}.pool .sub{font-size:.75rem;color:var(--soft);margin:0 0 .6rem;line-height:1.5}
.pool-list{overflow:auto;display:grid;gap:.4rem;align-content:start;padding:.15rem;min-height:90px;flex:1}
.pool.drop-over,.table-card.drop-over{outline:3px dashed var(--green);outline-offset:3px;background:#f7fbf6}
.table-card.drop-full{outline-color:var(--red);background:var(--red-light)}
.pool h4{margin:.8rem 0 .3rem;font-size:.75rem;color:var(--soft);font-weight:600}
.pool-filters{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .6rem}
.pool-filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .65rem;font-size:.75rem;cursor:pointer;color:var(--ink);min-height:30px}
.pool-filters button b{font-weight:600;color:var(--soft);margin-left:.2rem}
.pool-filters button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}.pool-filters button[aria-pressed=true] b{color:#fff}
.pool-filters button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.pool-list h4.sec{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.55rem 0 .15rem;padding:.4rem .6rem;position:sticky;top:-.15rem;z-index:1;border-radius:9px;background:var(--sec-bg,#f1ede5);border-left:5px solid var(--sec,var(--green));color:var(--ink);font-size:.75rem}
.pool-list h4.sec:first-child{margin-top:0}
.pool-list h4.sec b{font-weight:600;font-size:.75rem;background:#fff;border-radius:99px;padding:.05rem .5rem;color:var(--ink)}
.sec-familia_cercana{--sec:#ad8b36;--sec-bg:#f6efdc}.sec-familiares{--sec:#527653;--sec-bg:#e8f0e7}.sec-participantes{--sec:#a85d62;--sec-bg:#f5e8e9}.sec-iglesia{--sec:#6b5b95;--sec-bg:#eeeaf5}.sec-amigos{--sec:#3b7ea1;--sec-bg:#e6f0f6}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.9rem}
.table-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:.9rem;display:flex;flex-direction:column;gap:.45rem;min-height:150px}
.table-card.main{border-color:#ad8b3670;background:linear-gradient(#fffdf6,#fff 55%)}
.table-card.full .meter>i{background:var(--red)}
.table-card.targetable{cursor:pointer}.table-card.targetable:hover{border-color:var(--green);box-shadow:0 0 0 3px #52765322}
.t-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.4rem}
.t-head h4{font:600 1.35rem 'Poppins',system-ui,sans-serif;margin:0;line-height:1.1}
.badge.plain{background:var(--green-light);color:var(--green-dark)}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:.15rem .5rem;border-radius:999px;background:var(--gold-light);color:#7a5f10;margin-top:.25rem}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--soft);display:grid;place-items:center}.icon-btn:hover{color:var(--green);border-color:var(--green)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meter{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .2s}
.count{font-size:.75rem;color:var(--soft)}.count b{color:var(--ink)}
.seats{display:grid;gap:.25rem;align-content:start;flex:1}
.empty-seat{margin:0;padding:.9rem .5rem;border:1px dashed var(--line);border-radius:11px;text-align:center;font-size:.75rem;color:var(--soft)}
.move-here{margin-top:.2rem}
.guest{display:grid;gap:.1rem;text-align:left;width:100%;border:1px solid var(--line);border-left:5px solid var(--g,var(--line));border-radius:10px;background:#fff;padding:.4rem .6rem;cursor:grab;touch-action:manipulation;color:var(--ink)}
.guest:active{cursor:grabbing}.guest:hover{border-color:var(--green);border-left-color:var(--g,var(--green))}
.guest .g-name{font-size:.78rem;font-weight:500;display:flex;align-items:center;gap:.4rem;line-height:1.25}
.guest .g-meta{font-size:.75rem;color:var(--soft);line-height:1.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c9c2b6;flex:none}.dot.confirmado{background:var(--green)}.dot.no_asiste{background:var(--red)}
.guest.compact{padding:.28rem .55rem;border-radius:9px}.guest.compact .g-name{font-size:.75rem}
.guest.selected{background:var(--green-light);border-color:var(--green);box-shadow:0 0 0 3px #52765330}
.guest.related{background:#f3f8f2;border-color:#52765370}
.guest.declined{opacity:.75;background:var(--red-light)}
.guest.dim{opacity:.28}.guest.match{box-shadow:0 0 0 3px #ad8b3660;border-color:var(--gold)}
.guest[aria-disabled=true]{cursor:not-allowed;opacity:.6;background:#f2efe9}
.guest.dragging{opacity:.45}
.move-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;gap:.6rem;align-items:center;justify-content:center;flex-wrap:wrap;padding:.8rem 1rem;background:#1f3a22;color:#fff;box-shadow:0 -6px 24px #0003}
.move-bar.show{display:flex}.move-bar span{font-size:.78rem}.move-bar strong{font-weight:600}
.move-bar .btn{background:transparent;color:#fff;border-color:#ffffff60}.move-bar .btn.primary{background:#fff;color:var(--green-dark)}
body.busy .board{opacity:.7;pointer-events:none}
.modal{position:fixed;inset:0;z-index:15;display:none;place-items:center;padding:1rem;background:#261a1470;backdrop-filter:blur(3px)}
.modal.show{display:grid}
.dialog{width:min(440px,100%);background:#fff;border-radius:18px;padding:1.1rem;box-shadow:var(--shadow)}
.dialog h2{font:600 1.5rem 'Poppins',system-ui,sans-serif;margin:0 0 .6rem}
.dialog label{display:grid;gap:.35rem;font-size:.75rem;color:var(--soft);margin:.65rem 0}
.dialog select{width:100%;border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;font-size:.78rem;color:var(--ink);background:#fff}
.dialog input[type=text],.dialog input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;font-size:.78rem;color:var(--ink)}
.dialog .check{display:flex;align-items:flex-start;gap:.6rem;font-size:.76rem;color:var(--ink)}.dialog .check input{accent-color:var(--green);width:18px;height:18px;margin-top:.1rem}
.dialog .fine{font-size:.75rem;color:var(--soft);line-height:1.5;margin:.2rem 0 0}
.dialog-error{color:var(--red);font-size:.75rem;min-height:1.1em;margin:.4rem 0 0}
.modal-actions{display:flex;justify-content:space-between;gap:.5rem;margin-top:.9rem;flex-wrap:wrap}.modal-actions div{display:flex;gap:.5rem}
.auth{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:var(--ivory);padding:1rem}.auth.show{display:grid}
.auth-box{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:1.4rem;box-shadow:var(--shadow)}
.auth-box h2{font:600 1.6rem 'Poppins',system-ui,sans-serif;margin:0 0 .4rem}.auth-box p{font-size:.76rem;color:var(--soft);line-height:1.6;margin:0 0 .8rem}
.auth-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;font-size:.8rem}
.auth-box .error{margin-top:.6rem}
.toast{position:fixed;left:50%;bottom:5.2rem;transform:translate(-50%,20px);background:#241b16;color:#fff;padding:.7rem 1rem;border-radius:12px;font-size:.76rem;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:min(92vw,520px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.board{grid-template-columns:1fr}.pool{position:static;max-height:420px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{
  .top,.options,.pool,.move-bar,.icon-btn,.move-here,.toast,.notice,.intro p,.summary,.admin-sidebar,.admin-shell-overlay,.auth,.modal{display:none!important}
  body{background:#fff}.wrap{max-width:none;padding:0}
  .tables{grid-template-columns:repeat(2,1fr);gap:.6rem}.table-card{box-shadow:none;break-inside:avoid;min-height:0;border:1px solid #999}
  .guest{border:0;border-left:0;padding:.05rem 0;background:none!important;box-shadow:none!important;opacity:1!important}.guest .g-meta{display:none}.meter{display:none}
}
</style>
<link rel="stylesheet" href="/admin-shell.css?v=2" />
<script src="/admin-shell.js?v=2" defer></script>
</head>
<body>
<header class="top"><div class="brand"><h1>Mesas</h1><small>Boda Starlin &amp; Reneisy · 21 Nov 2026</small></div>
  <nav class="nav" aria-label="Acciones de mesas">
    <button class="btn primary" id="auto-btn" type="button">Organizar automáticamente</button>
    <button class="btn" id="print-btn" type="button">Imprimir</button>
    <button class="btn warn" id="reset-btn" type="button">Vaciar mesas</button>
    <button class="btn" id="logout" type="button">Salir</button>
  </nav>
</header>
<main class="wrap">
  <section class="summary" id="summary" aria-label="Resumen de mesas"></section>
  <div id="page-error" class="error" role="alert"></div>
  <div class="notice" id="notices" role="status" aria-live="polite"></div>
  <div class="options">
    <label><input type="checkbox" id="with-group" checked> Mover con su pareja o familia</label>
    <label><input type="checkbox" id="show-declined"> Mostrar a quienes no asistirán</label>
    <div class="grow"><label class="sr-only" for="search">Buscar invitado</label><input type="search" id="search" placeholder="Buscar invitado o familia… (te dice en qué mesa está)" autocomplete="off"></div>
  </div>
  <div class="board">
    <aside class="panel pool" id="sin-mesa" data-drop="none" aria-labelledby="pool-title">
      <h3 id="pool-title">Sin mesa</h3><p class="sub" id="pool-sub"></p>
      <div class="pool-filters" id="pool-filters" role="group" aria-label="Ver por categoría"></div>
      <div class="pool-list" id="pool-list"></div>
    </aside>
    <section class="tables" id="mesas" aria-label="Mesas"></section>
  </div>
</main>
<div class="move-bar" id="move-bar" role="region" aria-label="Mover invitado seleccionado">
  <span id="move-text"></span>
  <button class="btn" id="unseat-btn" type="button">Quitar de su mesa</button>
  <button class="btn primary" id="cancel-btn" type="button">Cancelar</button>
</div>
<div class="modal" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
  <form class="dialog" id="edit-form">
    <h2 id="edit-title">Editar mesa</h2>
    <label>Nombre de la mesa<input type="text" id="edit-name" maxlength="40" required></label>
    <label>Lugares<input type="number" id="edit-capacity" min="1" max="30" required></label>
    <label>Sección de la mesa<select id="edit-section"></select></label>
    <p class="dialog-error" id="edit-error" role="alert"></p>
    <div class="modal-actions"><button class="btn warn" id="edit-clear" type="button">Vaciar esta mesa</button><div><button class="btn" id="edit-cancel" type="button">Cancelar</button><button class="btn primary" id="edit-save" type="submit">Guardar</button></div></div>
  </form>
</div>
<div class="auth show" id="auth"><form class="auth-box" id="login-form"><h2>Acceso administrativo</h2><input id="password" type="password" autocomplete="current-password" placeholder="Clave de administración" aria-label="Clave de administración" required><button class="btn primary" type="submit" style="width:100%;margin-top:.6rem">Entrar</button><div class="error" id="login-error"></div></form></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/guest-removal.js?v=1"></script>
<script src="/admin-common.js?v=1"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const { escapeHtml: esc, withBusy } = AdminCommon;
const SECTIONS = [
  ['familia_cercana|novia', 'Familia cercana de la novia'], ['familia_cercana|novio', 'Familia cercana del novio'],
  ['familiares|novia', 'Familiares de la novia'], ['familiares|novio', 'Familiares del novio'],
  ['participantes|', 'Participantes de la boda'], ['iglesia|', 'Iglesia'],
  ['amigos|novia', 'Amigos de la novia'], ['amigos|novio', 'Amigos del novio'], ['amigos|', 'Amigos'],
  ['|', 'Cualquier invitado'],
];
let state = { tables: [], people: [], summary: {}, warnings: [] };
let poolFilter = 'all';
let selectedId = null, busy = false, dragging = false, planWarnings = [], editingTable = null, toastTimer;

async function api(url, options = {}) {
  const response = await fetch(url, { cache: 'no-store', credentials: 'same-origin', ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.error || 'No se pudo completar la solicitud.');
    error.status = response.status;
    if (response.status === 401 && !/action=(login|session|logout)/.test(url)) sessionExpired();
    throw error;
  }
  return data;
}
function sessionExpired() {
  $('auth').classList.add('show');
  const box = $('login-error');
  box.textContent = 'Tu sesión venció. Inicia sesión de nuevo para continuar.';
  box.classList.add('show');
}
function notify(message) {
  const el = $('toast');
  el.textContent = message; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
}
const hue = (text) => { let h = 0; for (const c of String(text)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const personById = (id) => state.people.find((person) => person.id === id);
const tableById = (id) => state.tables.find((table) => table.id === id);
const norm = (text) => String(text || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLocaleLowerCase('es').trim();
const POOL_FILTERS = [
  ['all', 'Todos', () => true],
  ['familia', 'Familia', (p) => ['familia_cercana', 'familiares'].includes(p.section_category)],
  ['participantes', 'Participantes', (p) => p.section_category === 'participantes'],
  ['iglesia', 'Iglesia', (p) => p.section_category === 'iglesia'],
  ['amigos', 'Amigos', (p) => p.section_category === 'amigos'],
];
const byGroupThenName = (a, b) => String(a.invitation_name).localeCompare(String(b.invitation_name), 'es')
  || String(a.invitation_id).localeCompare(String(b.invitation_id)) || String(a.nombre).localeCompare(String(b.nombre), 'es');

/* ───── Render ───── */
function chip(person, compact = false) {
  const grouped = person.group_type !== 'individual';
  const query = norm($('search').value);
  const related = selectedId != null && $('with-group').checked && person.id !== selectedId
    && personById(selectedId)?.invitation_id === person.invitation_id;
  const classes = ['guest'];
  if (person.id === selectedId) classes.push('selected'); else if (related) classes.push('related');
  if (person.estado_rsvp === 'no_asiste') classes.push('declined');
  if (query) classes.push(norm(`${person.nombre} ${person.invitation_name}`).includes(query) ? 'match' : 'dim');
  const meta = [grouped ? person.invitation_name : '', person.parentesco_label || (person.cercana ? 'Familia cercana' : person.categoria === 'familiares' ? 'Familiar' : ''),
    (person.roles || []).join(', '),
    person.estado_rsvp === 'no_asiste' ? 'No asistirá' : ''].filter(Boolean).map(esc).join(' · ');
  const state_ = person.estado_rsvp || 'pendiente';
  const label = state_ === 'confirmado' ? 'confirmó' : state_ === 'no_asiste' ? 'no asistirá' : 'sin responder';
  if (!person.seatable) {
    return `<div class="guest" aria-disabled="true" title="${esc(person.reason)}"><span class="g-name">${esc(person.nombre)}</span><span class="g-meta">Registro antiguo: identifica a cada persona primero</span></div>`;
  }
  return `<button type="button" class="${classes.join(' ')}${compact ? ' compact' : ''}" draggable="true" data-guest="${person.id}" aria-pressed="${person.id === selectedId}" title="${esc(`${person.nombre}${meta ? ' · ' + meta.replace(/<[^>]*>/g, '') : ''} · ${label}`)}"
    style="--g:${grouped ? `hsl(${hue(person.invitation_id)} 55% 45%)` : 'var(--line)'}">
    <span class="g-name"><i class="dot ${esc(state_)}" title="${label}"></i>${esc(person.nombre)}<span class="sr-only"> (${label})</span></span>${meta && !compact ? `<span class="g-meta">${meta}</span>` : ''}</button>`;
}

function render() {
  const s = state.summary || {};
  $('summary').innerHTML = [
    [s.to_seat ?? 0, 'Personas por sentar'], [s.seated ?? 0, 'Ya tienen mesa'],
    [s.unseated ?? 0, 'Sin mesa'], [s.free ?? 0, 'Lugares libres'],
  ].map(([value, label]) => `<div class="summary-card"><strong>${value}</strong><span>${label}</span></div>`).join('');

  const notices = [...(state.warnings || []).map((w) => ({ text: w.message, bad: w.type === 'capacity' })),
    ...planWarnings.map((w) => ({ text: w.message, bad: w.type === 'no_space' }))];
  const declinedSeated = state.people.filter((p) => p.table_id != null && p.estado_rsvp === 'no_asiste');
  $('notices').innerHTML = notices.map((n) => `<p class="${n.bad ? 'bad' : ''}">${esc(n.text)}</p>`).join('')
    + (declinedSeated.length ? `<p>${declinedSeated.length} persona${declinedSeated.length === 1 ? '' : 's'} sentada${declinedSeated.length === 1 ? '' : 's'} respondió que no asistirá. <button class="btn" id="release-declined" type="button" style="padding:.3rem .7rem;min-height:30px;margin-left:.4rem">Liberar sus lugares</button></p>` : '');

  const showDeclined = $('show-declined').checked;
  const query = norm($('search').value);
  const waiting = state.people.filter((p) => p.table_id == null && p.seatable && (showDeclined || p.estado_rsvp !== 'no_asiste'))
    .filter((p) => !query || norm(`${p.nombre} ${p.invitation_name}`).includes(query));
  $('pool-filters').innerHTML = POOL_FILTERS.map(([id, label, test]) =>
    `<button type="button" data-pool-filter="${id}" aria-pressed="${id === poolFilter}">${label}<b>${waiting.filter(test).length}</b></button>`).join('');
  const activeFilter = POOL_FILTERS.find(([id]) => id === poolFilter) || POOL_FILTERS[0];
  const pool = waiting.filter(activeFilter[2]);
  const review = state.people.filter((p) => !p.seatable);
  // Por categoría, en el mismo orden que las mesas; dentro de cada una, por grupo y nombre.
  // Dentro de una sección, los grupos con madre o padre van primero, luego los de hermanos y después el resto.
  const groupRanks = new Map();
  for (const person of state.people) groupRanks.set(person.invitation_id, Math.min(groupRanks.get(person.invitation_id) ?? 999, person.parentesco_order ?? 999));
  const byKinship = (a, b) => (groupRanks.get(a.invitation_id) - groupRanks.get(b.invitation_id))
    || (a.invitation_id === b.invitation_id ? (a.parentesco_order ?? 999) - (b.parentesco_order ?? 999) : 0)
    || byGroupThenName(a, b);
  const sections = [...pool.reduce((map, person) => {
    if (!map.has(person.section_key)) map.set(person.section_key, { label: person.section_label, category: person.section_category, order: person.section_order, people: [] });
    map.get(person.section_key).people.push(person);
    return map;
  }, new Map()).values()].sort((a, b) => a.order - b.order);
  $('pool-sub').textContent = `${pool.length} persona${pool.length === 1 ? '' : 's'} esperando mesa`;
  $('pool-list').innerHTML = (sections.length ? sections.map((section) =>
    `<h4 class="sec sec-${esc(section.category)}"><span>${esc(section.label)}</span><b>${section.people.length}</b></h4>${section.people.sort(byKinship).map((p) => chip(p)).join('')}`).join('')
    : `<p class="empty-seat">${query ? 'Nadie sin mesa con ese nombre.' : poolFilter !== 'all' ? 'No hay nadie de esta categoría sin mesa.' : 'Todos tienen mesa. 🎉'}</p>`)
    + (review.length ? `<h4>Requieren revisión (${review.length})</h4>${review.map((p) => chip(p)).join('')}` : '');

  const holding = selectedId != null;
  $('mesas').innerHTML = state.tables.map((table) => {
    const seated = state.people.filter((p) => p.table_id === table.id).sort(byGroupThenName);
    const pct = Math.min(100, Math.round(seated.length / table.capacity * 100));
    const full = seated.length >= table.capacity;
    const here = holding && personById(selectedId)?.table_id === table.id;
    return `<article class="table-card${table.is_main ? ' main' : ''}${full ? ' full' : ''}${holding && !here ? ' targetable' : ''}" data-drop="${table.id}" data-table="${table.id}">
      <div class="t-head"><div><h4>${esc(table.name)}</h4><span class="badge${table.is_main ? '' : ' plain'}">${esc(table.label || 'Cualquier invitado')}</span></div>
        <button class="icon-btn" type="button" data-edit="${table.id}" aria-label="Editar ${esc(table.name)}"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>
      <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <div class="count"><b>${seated.length}</b> / ${table.capacity} lugares${full ? ' · completa' : ` · ${table.capacity - seated.length} libre${table.capacity - seated.length === 1 ? '' : 's'}`}</div>
      <div class="seats">${seated.length ? seated.map((p) => chip(p, true)).join('') : '<p class="empty-seat">Arrastra o mueve invitados aquí</p>'}</div>
      ${holding && !here ? `<button class="btn primary move-here" type="button" data-move="${table.id}">Mover aquí</button>` : ''}
    </article>`;
  }).join('');

  const person = holding ? personById(selectedId) : null;
  $('move-bar').classList.toggle('show', Boolean(person));
  if (person) {
    const groupSize = state.people.filter((p) => p.invitation_id === person.invitation_id && p.seatable && p.estado_rsvp !== 'no_asiste').length;
    const withGroup = $('with-group').checked && groupSize > 1;
    $('move-text').innerHTML = `<strong>${esc(person.nombre)}</strong>${withGroup ? ` y su grupo (${groupSize} personas)` : ''} — toca una mesa para moverlo${person.table_id != null ? ` · ahora en ${esc(tableById(person.table_id)?.name || 'su mesa')}` : ''}`;
    $('unseat-btn').hidden = person.table_id == null;
  }
}

function setState(next) { state = { tables: next.tables, people: next.people, summary: next.summary, warnings: next.warnings }; }

/* ───── Acciones ───── */
async function run(action) {
  if (busy) return;
  busy = true; document.body.classList.add('busy');
  try { await action(); }
  catch (error) { if (error.status !== 401) notify(error.message); }
  finally { busy = false; document.body.classList.remove('busy'); render(); }
}

async function load() {
  try { $('page-error').classList.remove('show'); setState(await api('/api/tables')); render(); }
  catch (error) { if (error.status === 401) return; $('page-error').textContent = error.message; $('page-error').classList.add('show'); }
}

function moveTo(tableId) {
  if (selectedId == null) return;
  const person = personById(selectedId);
  if (!person) return;
  const withGroup = $('with-group').checked;
  if (tableId !== null && person.table_id === tableId && !withGroup) { notify(`${person.nombre} ya está en esa mesa.`); return; }
  if (tableId === null && person.table_id == null) { notify('Esa persona ya está sin mesa.'); return; }
  return run(async () => {
    const data = await api('/api/tables?action=move', { method: 'POST',
      body: JSON.stringify({ guest_ids: [person.id], table_id: tableId, with_group: withGroup }) });
    setState(data); planWarnings = []; selectedId = null;
    const count = data.result.moved;
    const where = tableId === null ? 'Sin mesa' : (tableById(tableId)?.name || 'la mesa');
    notify(`${count === 1 ? person.nombre : `${count} personas`} → ${where}`);
  });
}

function select(id) {
  if (selectedId === id) selectedId = null; else selectedId = id;
  render();
}

/* ───── Eventos ───── */
document.addEventListener('click', (event) => {
  const guest = event.target.closest('[data-guest]');
  if (guest) { select(Number(guest.dataset.guest)); return; }
  const filter = event.target.closest('[data-pool-filter]');
  if (filter) { poolFilter = filter.dataset.poolFilter; render(); return; }
  const edit = event.target.closest('[data-edit]');
  if (edit) { openEdit(Number(edit.dataset.edit)); return; }
  const move = event.target.closest('[data-move]');
  if (move) { moveTo(Number(move.dataset.move)); return; }
  const card = event.target.closest('.table-card');
  if (card && selectedId != null && !event.target.closest('button')) { moveTo(Number(card.dataset.table)); return; }
  if (event.target.id === 'release-declined') {
    const ids = state.people.filter((p) => p.table_id != null && p.estado_rsvp === 'no_asiste').map((p) => p.id);
    run(async () => { setState(await api('/api/tables?action=move', { method: 'POST', body: JSON.stringify({ guest_ids: ids, table_id: null }) }));
      notify('Se liberaron los lugares de quienes no asistirán.'); });
  }
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') { if ($('edit-modal').classList.contains('show')) closeEdit(); else if (selectedId != null) { selectedId = null; render(); } }
});

document.addEventListener('dragstart', (event) => {
  const guest = event.target.closest?.('[data-guest]');
  if (!guest) return;
  dragging = true; selectedId = Number(guest.dataset.guest);
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', String(selectedId));
  // Sin render(): reemplazar el elemento arrastrado cancelaría el gesto en algunos navegadores.
  const dragged = personById(selectedId);
  document.querySelectorAll('[data-guest]').forEach((el) => {
    const other = personById(Number(el.dataset.guest));
    if (el === guest) el.classList.add('selected', 'dragging');
    else if ($('with-group').checked && other && dragged && other.invitation_id === dragged.invitation_id) el.classList.add('related');
  });
});
document.addEventListener('dragend', () => {
  dragging = false;
  document.querySelectorAll('.drop-over,.drop-full').forEach((el) => el.classList.remove('drop-over', 'drop-full'));
  if (!busy) render();
});
document.addEventListener('dragover', (event) => {
  const zone = event.target.closest?.('[data-drop]');
  if (!zone) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drop-over,.drop-full').forEach((el) => { if (el !== zone) el.classList.remove('drop-over', 'drop-full'); });
  zone.classList.add('drop-over');
  const table = tableById(Number(zone.dataset.table));
  const person = personById(selectedId);
  if (table && person && person.table_id !== table.id && state.people.filter((p) => p.table_id === table.id).length >= table.capacity) zone.classList.add('drop-full');
});
document.addEventListener('drop', (event) => {
  const zone = event.target.closest?.('[data-drop]');
  if (!zone) return;
  event.preventDefault();
  dragging = false;
  zone.classList.remove('drop-over', 'drop-full');
  moveTo(zone.dataset.drop === 'none' ? null : Number(zone.dataset.drop));
});

$('unseat-btn').addEventListener('click', () => moveTo(null));
$('cancel-btn').addEventListener('click', () => { selectedId = null; render(); });
$('with-group').addEventListener('change', render);
$('show-declined').addEventListener('change', render);
$('search').addEventListener('input', render);
$('print-btn').addEventListener('click', () => window.print());
$('auto-btn').addEventListener('click', () => run(async () => {
  const data = await api('/api/tables?action=auto', { method: 'POST' });
  setState(data); planWarnings = data.result.plan_warnings || []; selectedId = null;
  notify(data.result.placed ? `Se sentaron ${data.result.placed} persona${data.result.placed === 1 ? '' : 's'}.` : 'No había personas por sentar.');
}));
$('reset-btn').addEventListener('click', () => {
  if (!state.people.some((p) => p.table_id != null)) { notify('Las mesas ya están vacías.'); return; }
  if (!confirm('¿Vaciar todas las mesas? Todos volverán a "Sin mesa". Las invitaciones y respuestas no cambian.')) return;
  run(async () => { setState(await api('/api/tables?action=reset', { method: 'POST', body: JSON.stringify({}) })); planWarnings = []; selectedId = null; notify('Mesas vaciadas.'); });
});

/* ───── Editar mesa ───── */
function openEdit(id) {
  const table = tableById(id);
  if (!table) return;
  editingTable = id;
  $('edit-title').textContent = `Editar ${table.name}`;
  $('edit-name').value = table.name; $('edit-capacity').value = table.capacity;
  $('edit-section').innerHTML = SECTIONS.map(([value, label]) => `<option value="${esc(value)}">${esc(label)}</option>`).join('');
  $('edit-section').value = `${table.category || ''}|${table.side || ''}`;
  $('edit-error').textContent = '';
  $('edit-modal').classList.add('show');
  $('edit-name').focus();
}
function closeEdit() { $('edit-modal').classList.remove('show'); editingTable = null; }
$('edit-cancel').addEventListener('click', closeEdit);
$('edit-modal').addEventListener('click', (event) => { if (event.target === $('edit-modal')) closeEdit(); });
$('edit-form').addEventListener('submit', (event) => {
  event.preventDefault();
  if (editingTable == null) return;
  const id = editingTable;
  return withBusy($('edit-save'), async () => {
    try {
      const [category, side] = $('edit-section').value.split('|');
      setState(await api('/api/tables', { method: 'PATCH', body: JSON.stringify({ id, name: $('edit-name').value,
        capacity: Number($('edit-capacity').value), category: category || null, side: side || null }) }));
      closeEdit(); render(); notify('Mesa actualizada.');
    } catch (error) { $('edit-error').textContent = error.message; }
  });
});
$('edit-clear').addEventListener('click', () => {
  const id = editingTable, table = tableById(id);
  if (!table || !state.people.some((p) => p.table_id === id)) { $('edit-error').textContent = 'Esta mesa ya está vacía.'; return; }
  if (!confirm(`¿Vaciar ${table.name}? Sus invitados volverán a "Sin mesa".`)) return;
  closeEdit();
  run(async () => { setState(await api('/api/tables?action=reset', { method: 'POST', body: JSON.stringify({ table_id: id }) })); notify(`${table.name} vaciada.`); });
});

/* ───── Sesión y actualización ───── */
$('login-form').addEventListener('submit', (event) => {
  event.preventDefault();
  const box = $('login-error'); box.classList.remove('show');
  return withBusy(event.submitter || event.target.querySelector('button[type=submit]'), async () => {
    try {
      await api('/api/guests?action=login', { method: 'POST', body: JSON.stringify({ password: $('password').value }) });
      $('password').value = ''; $('auth').classList.remove('show'); await load();
    } catch (error) { box.textContent = error.message; box.classList.add('show'); }
  });
});
$('logout').addEventListener('click', async () => { try { await api('/api/guests?action=logout', { method: 'POST' }); } catch { /* ya sin sesión */ } location.reload(); });

let refreshing = false;
async function refresh() {
  if (refreshing || busy || dragging || document.hidden || $('auth').classList.contains('show') || $('edit-modal').classList.contains('show')) return;
  refreshing = true;
  try { const next = await api('/api/tables'); setState(next); if (selectedId != null && !personById(selectedId)) selectedId = null; render(); }
  catch { /* se reintenta al volver a la pestaña */ }
  finally { refreshing = false; }
}
document.addEventListener('visibilitychange', refresh);
window.addEventListener('pageshow', (event) => { if (event.persisted) refresh(); });
window.addEventListener('storage', (event) => { if (event.key === GuestRemoval.eventKey) refresh(); });

(async () => {
  try {
    const session = await api('/api/guests?action=session');
    if (session.authenticated) { $('auth').classList.remove('show'); await load(); }
  } catch (error) { $('login-error').textContent = error.message; $('login-error').classList.add('show'); }
})();
</script>
</body>
</html>
